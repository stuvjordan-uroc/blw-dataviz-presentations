<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <!-- RevealJS core CSS -->
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">
  <!--<link rel="stylesheet" href="../../node_modules/reveal.js/dist/theme/white.css" id="theme"> -->

  <!-- Shared custom styles -->
  <link rel="stylesheet" href="../../shared/styles/theme.css">
  <link rel="stylesheet" href="../../shared/styles/common.css">
  <link rel="stylesheet" href="../../shared/styles/reset.css">

  <!-- Presentation-specific styles -->
  <style>
    /* Utility class for lists with spacing between items */
    ul.spaced-list>li:not(:last-child) {
      margin-bottom: 0.75em;
    }

    html.reveal-print .research-community-copy>p,
    html.reveal-print .research-community-copy>ul {
      grid-area: auto !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>

  <div class="reveal">
    <div class="slides">
      <!--logo and contact-->
      <section data-background-color="#FFFFFF">
        <div
          style="position: absolute; top: 0; left: 0; width: 960px; height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <img src="/assets/img/logo_dark_on_transparent.svg" width="960px" alt="Democracy Center logo">
        </div>
      </section>

      <!--contrast -- democracy discussions in the media vs what we do-->
      <section data-background-color="#001E5F" style="position: relative;">
        <div class="r-stack" style="position: absolute; top: 0; left: 0; width: 960px; height: 700px;">
          <img class="fragment fade-out" data-fragment-index="1"
            src="/assets/img/20261029-sas-natl-council/news-cycle-cartoon.png"
            style="width: 960px; height: 700px; object-fit: contain;" />
          <img class="fragment" data-fragment-index="1"
            src="/assets/img/20261029-sas-natl-council/public_student_programs_01.jpg"
            style="width: 960px; height: 700px; object-fit: contain;" />
        </div>
      </section>


      <!--research community overview and programs-->
      <section data-background-color="#001E5F" style="position: relative;">
        <div
          style="position: absolute; top: 0; left: 0; width: 960px; height: 700px; display: flex; flex-direction: row; align-items: center; justify-content: stretch; background-color: #001E5F;">
          <div class="research-community-copy"
            style="width: 50%; height: 700px; display: grid; place-items: center; padding-right: 40px">
            <p class="fragment fade-out" data-fragment-index="1"
              style="grid-area: 1 / 1; color: #FFFFFF; font-size: xx-large;">
              Research Community
            </p>
            <ul style="grid-area: 1 / 1; color: #FFFFFF; text-align: left; font-size: x-large; line-height: 1.2em;">
              <li class="fragment" data-fragment-index="1" style="margin-bottom: 2em;">Faculty working group</li>
              <li class="fragment" data-fragment-index="1" style="margin-bottom: 2em;">Visiting scholars program</li>
              <li class="fragment" data-fragment-index="1" style="margin-bottom: 2em;">Graduate student grants and
                fellowships</li>
              <li class="fragment" data-fragment-index="1">Academic conferences</li>
            </ul>
          </div>
          <div style="width: 60%; height: 700px; display: flex; align-items: center; justify-content: center;">
            <img src="/assets/img/20261029-sas-natl-council/research_community_04_01.jpg"
              style="width: 100%; height: 700px; object-fit: contain;" />
          </div>
        </div>
      </section>

      <!--public and student programs-->
      <section data-background-color="#001E5F" style="position: relative;">
        <div
          style="position: absolute; top: 0; left: 0; width: 960px; height: 700px; display: flex; flex-direction: row; align-items: center; justify-content: stretch; background-color: #001E5F;">
          <div style="width: 40%; height: 700px; display: grid; place-items: center; padding-right: 40px">
            <p
              style="grid-area: 1 / 1; color: #FFFFFF; font-size: xx-large; text-align: left; line-height: 1.2em; max-width: 200px;">
              Programs for Undergraduates and the Public
            </p>
          </div>
          <div style="width: 60%; height: 700px; display: flex; align-items: center; justify-content: center;">
            <img src="/assets/img/20261029-sas-natl-council/public_student_programs_02.jpg"
              style="width: 100%; height: 700px; object-fit: contain;" />
          </div>
        </div>
      </section>

      <!--public and student programs detail-->
      <section data-background-color="#001E5F" style="position: relative;">
        <div
          style="position: absolute; top: 0; left: 0; width: 960px; height: 700px; display: grid; row-gap: 10px; grid-template-columns: repeat(2, 480px); grid-template-rows: repeat(4, 1fr); background-color: #001E5F; color: #FFFFFF; font-size: x-large; text-align: left; line-height: 1.2em;">
          <div style="width: 480px; height: 175px; display: flex; align-items: center; justify-content: center;">
            <p>Public lectures</p>
          </div>
          <img src="/assets/img/20261029-sas-natl-council/evans_meliora_480_175.jpg" width="420px" />
          <div class="fragment" data-fragment-index="1"
            style="width: 480px; height: 175px; display: flex; align-items: center; justify-content: center;">
            <p>Alumni seminars</p>
          </div>
          <img class="fragment" data-fragment-index="1"
            src="/assets/img/20261029-sas-natl-council/alum_seminar_480_175.jpg" width="420px" />
          <div class="fragment" data-fragment-index="2"
            style="width: 480px; height: 175px; display: flex; align-items: center; justify-content: center;">
            <p>Film series</p>
          </div>
          <img class="fragment" data-fragment-index="2"
            src="/assets/img/20261029-sas-natl-council/film_series_480_175.jpg" width="420px" />
          <div class="fragment" data-fragment-index="3"
            style="width: 480px; height: 175px; display: flex; align-items: center; justify-content: center;">
            <p>Jill Cohen fellowship</p>
          </div>
          <img class="fragment" data-fragment-index="3"
            src="/assets/img/20261029-sas-natl-council/jill_cohen_fellows_480_175.jpg" width="420px" />
        </div>
      </section>

      <!--mailing list slide-->
      <section data-background-image="../../assets/img/20261029-sas-natl-council/rr_at_night.jpg"
        data-background-size="cover">
        <div style="position: absolute; top: 0; left: 0; width: 960px; height: 700px">
          <div
            style="position: absolute; top: 35px; right: 200px; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
            <img src="/assets/img/dem-center-contact/mailchimp_subscribe_form_QR.svg" width="250px">
            <p style="font-size: x-large;">Join our mailing list!</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- RevealJS scripts -->
  <script type="module">
    import Reveal from '../../node_modules/reveal.js/dist/reveal.esm.js';
    import RevealHighlight from '../../node_modules/reveal.js/plugin/highlight/highlight.esm.js';
    import RevealNotes from '../../node_modules/reveal.js/plugin/notes/notes.esm.js';

    // Initialize RevealJS
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      transition: 'slide',
      pdfSeparateFragments: false,
      plugins: [RevealHighlight, RevealNotes]
    });
  </script>
</body>

</html>
