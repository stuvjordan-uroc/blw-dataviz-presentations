<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <!-- RevealJS core CSS -->
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/theme/white.css" id="theme">

  <!-- Shared custom styles -->
  <link rel="stylesheet" href="../../shared/styles/theme.css">
  <link rel="stylesheet" href="../../shared/styles/common.css">

  <!-- Presentation-specific styles -->
  <style>
    /* Utility class for lists with spacing between items */
    ul.spaced-list>li:not(:last-child) {
      margin-bottom: 0.75em;
    }

    /* Keep overlay fragments anchored to slide content area */
    .slide-overlay-anchor {
      position: relative;
      width: 960px;
      height: 700px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-overlay-anchor>img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .slide-image-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      font-size: 1.8rem;
      line-height: 1.25;
      background: rgba(0, 0, 0, 0.65);
      z-index: 2;
      padding: 2rem;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="reveal">
    <div class="slides">

      <!-- Title Slide -->
      <section data-background-color="#2D2E35" style="position: relative;">
        <div class="slide-overlay-anchor">
          <img src="/assets/img/logo_dem_center.webp" width="2000px" alt="Logo" class="no-border">
        </div>
      </section>
      <section data-background-color="#2D2E35">
        <img src="/assets/img/20261007-ehsr/Feelings_by_Morris_Albert_French_vinyl_artwork.jpg" width="600px"
          alt="Cover art for the 1974 album 'Feelings' by Morris Albert French" class="no-border">
        <div class="fragment fade-in slide-image-overlay"
          style="font-size: xxx-large; font-weight: 800; transform: rotate(-0deg);">
          <div>
            <div>Feelings?</div>
            <div>Nothing more than Feelings?</div>
          </div>
        </div>
      </section>
      <section data-background-color="#2D2E35">
        <h1>Partisan Hostility</h1>
        <ul>
          <li>(How much) Does it threaten democracy in the U.S.?</li>
          <li>(How) Can the threat be mitigated?</li>
        </ul>
      </section>
      <section data-background-color="#2D2E35">
        <h2>Wait...<em>What's Democracy?</em></h2>
        <ul>
          <li>"Thick" (outcome-based) definition</li>
          <li>"Thin" (procedural) definition</li>
        </ul>
      </section>
    </div>
  </div>

  <!-- RevealJS scripts -->
  <script type="module">
    import Reveal from '../../node_modules/reveal.js/dist/reveal.esm.js';
    import RevealHighlight from '../../node_modules/reveal.js/plugin/highlight/highlight.esm.js';
    import RevealNotes from '../../node_modules/reveal.js/plugin/notes/notes.esm.js';

    // Initialize RevealJS
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      transition: 'slide',
      plugins: [RevealHighlight, RevealNotes]
    });
  </script>
</body>

</html>
